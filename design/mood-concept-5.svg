<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f5f1"/>
      <stop offset="100%" stop-color="#edf7f2"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#7a8d7c" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg5)"/>

  <rect x="90" y="85" width="1020" height="730" rx="30" fill="#fffefb" filter="url(#softShadow)"/>

  <text x="140" y="165" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1d2a1d">Check-in</text>
  <text x="140" y="210" font-family="Arial, sans-serif" font-size="18" fill="#5d6b5d">Wie war deine innere Verfassung?</text>

  <g>
    <rect x="140" y="255" width="200" height="200" rx="28" fill="#f4f9f5"/>
    <circle cx="240" cy="330" r="42" fill="#8bcc9a"/>
    <text x="240" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1d2a1d">ruhig</text>
  </g>

  <g>
    <rect x="360" y="255" width="200" height="200" rx="28" fill="#fbf7ea"/>
    <circle cx="460" cy="330" r="42" fill="#f0d276"/>
    <text x="460" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1d2a1d">lebendig</text>
  </g>

  <g>
    <rect x="580" y="255" width="200" height="200" rx="28" fill="#f9f0ea"/>
    <circle cx="680" cy="330" r="42" fill="#d99a7a"/>
    <text x="680" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1d2a1d">erschöpft</text>
  </g>

  <g>
    <rect x="800" y="255" width="200" height="200" rx="28" fill="#f5f0fb"/>
    <circle cx="900" cy="330" r="42" fill="#b89ae6"/>
    <text x="900" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1d2a1d">angespannt</text>
  </g>

  <rect x="140" y="500" width="860" height="160" rx="24" fill="#f4f8f4"/>
  <text x="170" y="550" font-family="Arial, sans-serif" font-size="20" fill="#5d6b5d">Kurzbeschreibung</text>
  <text x="170" y="610" font-family="Arial, sans-serif" font-size="26" fill="#213322">Heute eher ruhig, aber mit viel im Kopf.</text>

  <rect x="140" y="690" width="220" height="56" rx="14" fill="#f3f3f2"/>
  <text x="250" y="726" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#334137">Zeitpunkt 13:45</text>

  <rect x="805" y="690" width="195" height="56" rx="14" fill="#4fa77f"/>
  <text x="902" y="726" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Speichern</text>
</svg>
