    <text x="558" y="307" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2d22">gut</text>
    <text x="558" y="342" font-family="Arial, sans-serif" font-size="18" fill="#4e6256">eher stabil</text>
