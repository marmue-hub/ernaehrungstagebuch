  <text x="140" y="215" font-family="Arial, sans-serif" font-size="20" fill="#5f7260">Heute am 25.10.2026</text>

  <g>
    <rect x="140" y="260" width="280" height="140" rx="24" fill="#eaf9ef"/>
    <circle cx="190" cy="316" r="32" fill="#f8e58d"/>
    <text x="238" y="307" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2d22">super</text>
    <text x="238" y="342" font-family="Arial, sans-serif" font-size="18" fill="#4e6256">sehr gut</text>
  </g>

