services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ernahrungstagebuch
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ernahrungstagebuch"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://app:secret@postgres:5432/ernahrungstagebuch
      APP_NAME: Ernährungstagebuch
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost,http://wiegehts.x73.eu,https://wiegehts.x73.eu,https://www.wiegehts.x73.eu
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_APP_ENV: production
      VITE_API_URL: ""
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm run build && npm run preview -- --host 0.0.0.0 --port 5173 --strictPort"

volumes:
  postgres_data:
